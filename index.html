<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LJSP - A small lisp for JavaScript developers</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');

        ::selection
        {
            background:  rgba(230, 219, 116, .3);
            color:       #EEE;
            text-shadow: none;
        }

        *
        {
            scroll-behavior: smooth;
            transition:      opacity .8s;
        }

        body
        {
            font-family: 'Geist', sans-serif;
            color:       oklch(98.5% 0 none);
            margin:      0;
            min-height:  100svh;
            background-color: oklch(20.5% 0 none);
            animation:       fade-in-slide-up .8s ease-out forwards;
        }

        h1
        {
            font-size:     5rem;
            margin-bottom: 0;
            margin-top:    1rem;
        }

        h2
        {
            color:      oklch(87% 0 none);
            text-align: center;
            font-size:  1.5rem;
        }

        label
        {
            font-size:     1rem;
            margin-bottom: .4rem;
            color:         oklch(70.8% 0 none);
        }

        textarea
        {
            background-color: oklch(26.9% 0 none);
            border:           2px solid oklch(37.1% 0 none);
            border-radius:    8px;
            height:           48vh;
            color:            oklch(98.5% 0 none);
            font-family:      "JetBrains Mono", monospace;
            font-size:        1.2rem;
            padding:          1rem;
            box-sizing:       border-box;
            resize:           none;
        }

        textarea:focus
        {
            outline:    none;
            box-shadow: rgba(149, 157, 165, 0.1) 0 2px 24px;
        }

        code
        {
            font-family:      "JetBrains Mono", monospace;
            background-color: oklch(14.5% 0 none);
            color:            #e6db74;
            border:           2px solid oklch(37.1% 0 none);
            border-radius:    8px;
            width:            40svw;
            height:           15vh;
            padding:          1rem;
            font-size:        1.2rem;
            display:          block;
        }

        pre
        {
            font-family:      "JetBrains Mono", monospace;
            background-color: oklch(26.9% 0 none);
            border:           2px solid oklch(37.1% 0 none);
            border-radius:    8px;
            width:            40svw;
            height:           100%;
            max-height:       100%;
            padding:          1rem;
            font-size:        1rem;
            margin-top:       0;
            margin-bottom:    0;
            box-sizing:       border-box;
            overflow-y:       auto;
        }

        #app
        {
            display:         flex;
            flex-direction:  column;
            justify-content: center;
            align-items:     center;
        }

        #split-view
        {
            display:               grid;
            grid-template-columns: 1fr 1fr;
            justify-content:       center;
            gap:                   2rem;
            height:                70vh;
        }

        #split-view > #left
        {
            display:        flex;
            flex-direction: column;
        }

        #split-view > #right
        {
            display:        flex;
            flex-direction: column;
            height:         100%;
            min-height:     0;
        }

        #ljsp-output-caret
        {
            margin-left: .2rem;
        }

        .hidden
        {
            display: none;
        }

        .hljs
        {
            background-color: oklch(26.9% 0 none) !important;
        }

        @keyframes fade-in-slide-up
        {
            0%
            {
                opacity:   0;
                transform: translateY(20px);
            }
            100%
            {
                opacity:   1;
                transform: translateY(0);
            }
        }

        @media (width <= 768px)
        {
            h1
            {
                font-size: 3rem;
            }

            h2
            {
                font-size: 1.1rem;
            }

            #split-view
            {
                grid-template-columns: 1fr;
                width:                 100%;
                gap:                   1.5rem;
            }

            textarea,
            pre
            {
                width: 100%;
            }

            code
            {
                width: 91%;
            }

            textarea
            {
                height: 30vh;
            }

            pre
            {
                min-height: 30vh;
            }
        }
    </style>
</head>
<body>
<div id="app">
    <h1>L<span style="color: #e6db74">JS</span>P</h1>
    <h2 style="margin-bottom: 2rem;">A small <span style="font-style: italic">lisp</span> for <span
            style="color: #e6db74">JavaScript</span> developers.</h2>
    <div id="split-view">
        <div id="left">
            <label for="ljsp-code">Source</label>
            <textarea id="ljsp-code" style="margin-bottom: 1rem;">;check your dev console :)
(:const str 'Hello LJSP!')
($console.log str)
            </textarea>

            <label for="ljsp-output">Output</label>
            <code id="ljsp-output"><span id="ljsp-output-caret">|</span></code>
        </div>
        <div id="right">
            <label for="ljsp-ast">AST</label>
            <pre id="ljsp-ast" class="language-json"></pre>
        </div>
    </div>
</div>
<script type="module">
    import {run} from '/src/ljsp.ts';
    import hljs from 'highlight.js';
    import 'highlight.js/styles/monokai-sublime.css';

    hljs.highlightAll();

    const ljsp_code = document.querySelector('#ljsp-code');
    const ljsp_ast = document.querySelector('#ljsp-ast');
    const ljsp_output = document.querySelector('#ljsp-output');
    const ljsp_output_caret = document.querySelector('#ljsp-output-caret');

    ljsp_code.addEventListener('focusout', () =>
    {
        try
        {
            const {ast, output} = run(ljsp_code.value);

            ljsp_ast.textContent = JSON.stringify(ast, null, 2)
            ljsp_output.textContent = output;
            ljsp_output.style.color = '#e6db74'
            ljsp_output.appendChild(ljsp_output_caret);

            delete ljsp_ast.dataset.highlighted;
            hljs.highlightElement(ljsp_ast);
        }
        catch (err)
        {
            ljsp_ast.textContent = 'Error occurred, could not build ast.'
            ljsp_output.style.color = '#f92672'
            ljsp_output.textContent = err;
        }
    });

    setInterval(() =>
    {
        ljsp_output_caret.classList.toggle('hidden');
    }, 1000);
</script>
</body>
</html>
